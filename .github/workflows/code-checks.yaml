name: Code Checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - '.github/workflows/code-checks.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - '.github/workflows/code-checks.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  type-check:
    name: TypeScript (Node ${{ matrix.node }})
    # Skip on draft PRs to avoid burning Actions minutes on work-in-progress.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # No lockfile in this repo; key the npm cache off package.json so
          # setup-node can still restore ~/.npm between runs.
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        # No lockfile or test runner here; install resolves devDeps
        # (typescript, @mantine/core peer, @polis/react) so `tsc --noEmit`
        # can resolve all type references.
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint (ESLint + Prettier)
        # Conservative gate: eslint rules are mostly `warn`, prettier --check
        # blocks if formatting drifts. Promote warns to errors in a follow-up
        # once the codebase is at zero warnings.
        run: npm run lint
